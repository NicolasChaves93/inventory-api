# --- App ---
spring.application.name=inventory-api
server.port=8080


# JPA + SQLite
spring.datasource.url=jdbc:sqlite:./data/central_inventory.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# --- RabbitMQ (central bus de eventos) ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- Store Configuration ---
store.name=TIENDA_CENTRAL
store.role=central

#store.name=TIENDA_A
#store.role=local

app.messaging.exchange=inventory.events.exchange
app.messaging.queue=inventory.events.queue

# Routing keys
app.messaging.routing-key-all=inventory.events.all
app.messaging.routing-key-local=inventory.events.local

# --- Logs ---
logging.level.org.springframework=INFO
logging.level.com.acme.inventory=DEBUG